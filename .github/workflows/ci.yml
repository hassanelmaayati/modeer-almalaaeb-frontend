name: Frontend tests and deployment

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  # Main runs may already be uploading a release; do not interrupt them.
  # The deployment script rejects an obsolete main SHA before uploading.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PIPENV_DONT_LOAD_ENV: '1'
  PIPENV_VENV_IN_PROJECT: '1'

jobs:
  configuration:
    name: Frontend gate policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend_sha: ${{ steps.counterpart.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify fail-closed gates without deploying
        run: |
          python .github/scripts/ci_gate.py --self-test
          python .github/scripts/deploy_frontend.py --self-test
      - name: Resolve backend once to an immutable commit
        id: counterpart
        run: python .github/scripts/resolve_counterpart.py hassanelmaayati/modeer-almalaaeb-backend

  frontend:
    name: Frontend lint, unit coverage and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies (network setup)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Offline unit tests with coverage
        run: npm run test:unit:coverage
      - name: Build checked-out frontend
        env:
          VERCEL: '1'
          VITE_API_BASE_URL: https://modeer-almalaaeb-backend.onrender.com/api/v1
          VITE_GOOGLE_CLIENT_ID: ''
        run: npm run build
      - name: Preserve unit coverage and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-${{ github.sha }}
          path: |
            tests/artifacts/
            coverage/
          if-no-files-found: ignore
          retention-days: 14

  fullstack:
    name: Frontend fullstack offline browsers
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEER_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hassanelmaayati/modeer-almalaaeb-backend
          ref: ${{ needs.configuration.outputs.backend_sha }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/Pipfile.lock
      - name: Install PostgreSQL and PostGIS (network setup)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16 postgresql-16-postgis-3
      - name: Install locked Python dependencies (network setup)
        working-directory: backend
        run: |
          python -m pip install pipenv==2024.0.1
          pipenv verify
          pipenv sync --dev
          printf 'MODEER_TEST_PYTHON=%s\n' "$PWD/.venv/bin/python" >> "$GITHUB_ENV"
          printf 'MODEER_BACKEND_PATH=%s\n' "$PWD" >> "$GITHUB_ENV"
      - name: Install locked frontend and browser dependencies (network setup)
        working-directory: frontend
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Record the exact tested pair
        run: |
          printf 'Frontend: %s\nBackend: %s\n' "$(git -C frontend rev-parse HEAD)" "$(git -C backend rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Offline full Chromium journeys, Firefox/WebKit smoke and dev proxy
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-fullstack-${{ github.sha }}
          path: frontend/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Frontend CI
    if: always()
    needs: [configuration, frontend, fullstack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every mandatory job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py --results "$CI_JOB_RESULTS" --required configuration frontend fullstack

  deploy:
    name: Deploy tested frontend to Vercel
    needs: [configuration, frontend, fullstack, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: modeer-frontend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked project and pinned Vercel CLI
        run: |
          npm ci
          npm install --global vercel@62.4.0
      - name: Build and deploy only the successful, current main commit
        env:
          VERCEL: '1'
          VERCEL_DEPLOY_ENABLED: ${{ vars.VERCEL_DEPLOY_ENABLED }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          MODEER_TESTED_BACKEND_SHA: ${{ needs.configuration.outputs.backend_sha }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/deploy_frontend.py
